        .dot { width: 10px; height: 10px; border-radius: 50%; background: #555; flex-shrink: 0; }
        .dot.ok { background: #2ecc71; box-shadow: 0 0 6px #2ecc71; }
        .dot.error { background: #e74c3c; box-shadow: 0 0 6px #e74c3c; }
        .dot.loading { background: #f39c12; animation: pulse 1s infinite; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
        .container { max-width: 860px; margin: 0 auto; padding: 16px; }
        .section-title { font-size: 12px; font-weight: bold; color: #4fa6ff; text-transform: uppercase; letter-spacing: 1px; margin: 20px 0 8px; border-bottom: 1px solid #2a2a3e; padding-bottom: 5px; display: flex; align-items: center; gap: 8px; }
        .section-count { background: #1a3a5a; color: #7ec8ff; font-size: 10px; padding: 2px 7px; border-radius: 10px; font-weight: bold; }
        .canal-card { background: #1c1c2e; border: 1px solid #2a2a3e; border-radius: 8px; padding: 12px; margin-bottom: 8px; transition: border-color 0.2s; }
        .canal-card:hover { border-color: #3a3a5e; }
        .canal-card.editando { border-color: #f39c12; background: #1e1a08; }
        .canal-card.guardado { border-color: #2ecc71; background: #0a1e0a; }
        .canal-card.no-config { border-color: #3a1a1a; }
        .canal-header { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
        .canal-nombre { font-size: 14px; font-weight: bold; color: #fff; flex: 1; }
        .canal-key { font-size: 10px; color: #555; background: #111; padding: 2px 6px; border-radius: 4px; font-family: monospace; }
        .canal-url { font-size: 11px; color: #777; background: #111; padding: 7px 10px; border-radius: 5px; word-break: break-all; line-height: 1.4; cursor: pointer; transition: color 0.2s; }
        .canal-url:hover { color: #aaa; }
        .canal-url.empty { color: #444; font-style: italic; }
        .edit-area { display: none; margin-top: 8px; }
        .edit-area textarea { width: 100%; padding: 10px; background: #0d0d1a; border: 1px solid #4fa6ff; border-radius: 6px; color: #fff; font-size: 12px; resize: vertical; min-height: 70px; font-family: monospace; outline: none; line-height: 1.4; }
        .edit-buttons { display: flex; gap: 8px; margin-top: 8px; }
        .btn-guardar { background: #0b5394; color: white; border: none; padding: 8px 18px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold; flex: 1; transition: 0.2s; }
        .btn-guardar:hover { background: #1a6ab5; }
        .btn-guardar:disabled { background: #333; cursor: not-allowed; }
        .btn-cancelar { background: #2a2a3e; color: #aaa; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; transition: 0.2s; }
        .btn-cancelar:hover { background: #3a3a5e; }
        .btn-editar { background: transparent; color: #4fa6ff; border: 1px solid #2a4a7a; padding: 4px 10px; border-radius: 5px; cursor: pointer; font-size: 11px; transition: 0.2s; white-space: nowrap; }
        .btn-editar:hover { background: #0b5394; color: white; border-color: #4fa6ff; }
        .msg { font-size: 12px; margin-top: 6px; padding: 6px 10px; border-radius: 4px; display: none; }
        .msg.ok { background: #0d3a1a; color: #2ecc71; border: 1px solid #2ecc71; display: block; }
        .msg.error { background: #3a0d0d; color: #e74c3c; border: 1px solid #e74c3c; display: block; }
        .reload-btn { background: #1a2a3e; color: #4fa6ff; border: 1px solid #4fa6ff; padding: 7px 14px; border-radius: 6px; cursor: pointer; font-size: 12px; transition: 0.2s; }
        .reload-btn:hover { background: #0b5394; color: white; }
        .search-wrap { padding: 12px 0 4px; }
        .search-wrap input { width: 100%; padding: 10px 14px; background: #1a1a2e; border: 1px solid #2a2a3e; border-radius: 8px; color: white; font-size: 14px; outline: none; }
        .search-wrap input:focus { border-color: #4fa6ff; }
        .token-badge { background: #3a1a00; color: #f0a050; font-size: 9px; padding: 2px 6px; border-radius: 4px; font-weight: bold; margin-left: 4px; }
        .critical-section .canal-card { border-left: 3px solid #f0a050; }

            'prattel_pe': '📺 Prattel TV 🇵🇪', 'canal23_ni': '📺 Canal 23 🇳🇮',
            'italia9': '📺 Italia 9 🇮🇹', 'cl_tevex': '📺 TeVex 🇨🇱',
            'cl_chilechannel': '📺 Chile Channel 🇨🇱', 'cl_clicktv': '📺 Click TV 🇨🇱',
            'cn_baichengtv': '📺 Baicheng TV 🇨🇳', 'jp_cgntv': '📺 CGNTV Japan 🇯🇵',
            'fi_eveo': '📺 Eveo 🇫🇮', 'de_freesports': '📺 World of Freesports 🇩🇪',
            'de_rictv': '📺 RIC TV 🇩🇪', 'de_grjngo': '📺 Grjngo Western 🇩🇪'
        }
    }
};

function guardarToken() {
    var t = document.getElementById('token-input').value.trim();
    if (!t || !t.startsWith('ghp_')) {
        document.getElementById('token-status').textContent = '❌ Token inválido (debe empezar con ghp_)';
        document.getElementById('token-status').style.color = '#e74c3c';
        return;
    }
    localStorage.setItem('gh_token_tvpy', t);
    GITHUB_TOKEN = t;
    document.getElementById('token-input').value = '';
    document.getElementById('token-status').textContent = '✅ Token guardado localmente';
    document.getElementById('token-status').style.color = '#2ecc71';
    // Mostrar estado del token al arrancar
(function() {
    var t = localStorage.getItem('gh_token_tvpy');
    if (t) {
        document.getElementById('token-status').textContent = '✅ Token guardado';
        document.getElementById('token-status').style.color = '#2ecc71';
    } else {
        document.getElementById('token-status').textContent = '⚠️ Sin token — ingresalo arriba para poder guardar';
        document.getElementById('token-status').style.color = '#f39c12';
    }
})();

cargarCanales();
}

function borrarToken() {
    localStorage.removeItem('gh_token_tvpy');
    GITHUB_TOKEN = '';
    document.getElementById('token-input').value = '';
    document.getElementById('token-status').textContent = '🗑️ Token eliminado';
    document.getElementById('token-status').style.color = '#f39c12';
}

function setStatus(t, x) {
    document.getElementById('status-dot').className = 'dot ' + t;
    document.getElementById('status-text').textContent = x;
}

function cargarCanales() {
    setStatus('loading', 'Cargando canales desde GitHub...');
    fetch('https://cdn.jsdelivr.net/gh/' + REPO + '@main/' + FILE + '?t=' + Date.now())
        .then(function(r) { return r.json(); })
        .then(function(data) {
            canalesData = data;
            renderCanales();
            var ahora = new Date().toLocaleTimeString();
            document.getElementById('last-update').textContent = 'Última carga: ' + ahora;
            setStatus('ok', 'Conectado — ' + Object.keys(data).length + ' canales cargados');
            // Obtener SHA para poder guardar
            fetch('https://api.github.com/repos/' + REPO + '/contents/' + FILE, {
                headers: { 'Authorization': 'token ' + GITHUB_TOKEN, 'Accept': 'application/vnd.github.v3+json' }
            }).then(function(r) { return r.json(); })
              .then(function(d) { fileSha = d.sha; })
              .catch(function() {});
        })
        .catch(function() { setStatus('error', 'Error al cargar canales desde GitHub'); });
}

function renderCanales() {
    Object.keys(secciones).forEach(function(secId) {
        var lista = document.getElementById(secId);
        if (!lista) return;
        lista.innerHTML = '';
        var sec = secciones[secId];
        var count = 0;
        sec.keys.forEach(function(key) {
            var nombre = sec.nombres[key] || key;
            var url = canalesData[key] || '';
            var card = document.createElement('div');
            card.className = 'canal-card' + (url ? '' : ' no-config');
            card.id = 'card-' + key;
            var urlDisplay = url || '(sin configurar)';
            var urlClass = url ? 'canal-url' : 'canal-url empty';
            card.innerHTML =
                '<div class="canal-header">' +
                    '<span class="canal-nombre">' + nombre + '</span>' +
                    '<span class="canal-key">' + key + '</span>' +
                    '<button class="btn-editar" onclick="editarCanal(\'' + key + '\')">✏️ Editar</button>' +
                '</div>' +
                '<div class="' + urlClass + '" id="url-' + key + '" onclick="editarCanal(\'' + key + '\')" title="Clic para editar">' + urlDisplay + '</div>' +
                '<div class="edit-area" id="edit-' + key + '">' +
                    '<textarea id="ta-' + key + '">' + url + '</textarea>' +
                    '<div class="edit-buttons">' +
                        '<button class="btn-guardar" id="btn-' + key + '" onclick="guardarCanal(\'' + key + '\')">💾 Guardar en GitHub</button>' +
                        '<button class="btn-cancelar" onclick="cancelarEdicion(\'' + key + '\')">✕ Cancelar</button>' +
                    '</div>' +
                    '<div class="msg" id="msg-' + key + '"></div>' +
                '</div>';
            lista.appendChild(card);
            count++;
        });
        // Actualizar contador de sección
        var cntId = 'cnt-' + secId.replace('lista-', '');
        var cntEl = document.getElementById(cntId);
        if (cntEl) cntEl.textContent = count;
    });
}

function editarCanal(key) {
    document.querySelectorAll('.canal-card').forEach(function(c) {
        c.classList.remove('editando');
        c.querySelector('.edit-area').style.display = 'none';
    });
    var card = document.getElementById('card-' + key);
    if (!card) return;
    card.classList.add('editando');
    card.querySelector('.edit-area').style.display = 'block';
    var ta = document.getElementById('ta-' + key);
    ta.focus();
    ta.select();
    card.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function cancelarEdicion(key) {
    var card = document.getElementById('card-' + key);
    if (!card) return;
    card.classList.remove('editando');
    card.querySelector('.edit-area').style.display = 'none';
    document.getElementById('ta-' + key).value = canalesData[key] || '';
}

function guardarCanal(key) {
    var url = document.getElementById('ta-' + key).value.trim();
    var msg = document.getElementById('msg-' + key);
    var btn = document.getElementById('btn-' + key);
    if (!url) return;
    if (!GITHUB_TOKEN || GITHUB_TOKEN === 'TU_TOKEN_AQUI') {
        msg.className = 'msg error';
        msg.textContent = '⚠️ Configurá tu Token de GitHub arriba en el código';
        return;
    }
    btn.disabled = true;
    btn.textContent = '⏳ Guardando...';
    msg.className = 'msg';
    canalesData[key] = url;
    var enc = btoa(unescape(encodeURIComponent(JSON.stringify(canalesData, null, 2))));
    fetch('https://api.github.com/repos/' + REPO + '/contents/' + FILE, {
        method: 'PUT',
        headers: {
            'Authorization': 'token ' + GITHUB_TOKEN,
            'Accept': 'application/vnd.github.v3+json',
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({ message: 'Actualizar ' + key, content: enc, sha: fileSha })
    }).then(function(r) { return r.json(); })
      .then(function(data) {
          if (data.content) {
              fileSha = data.content.sha;
              document.getElementById('url-' + key).textContent = url;
              document.getElementById('url-' + key).className = 'canal-url';
              var card = document.getElementById('card-' + key);
              card.classList.remove('editando', 'no-config');
              card.classList.add('guardado');
              card.querySelector('.edit-area').style.display = 'none';
              setTimeout(function() { card.classList.remove('guardado'); }, 3000);
              setStatus('ok', '✅ ' + key + ' guardado correctamente');
          } else {
              msg.className = 'msg error';
              msg.textContent = '❌ Error: ' + (data.message || 'Verificá tu Token de GitHub');
          }
          btn.disabled = false;
          btn.textContent = '💾 Guardar en GitHub';
      })
      .catch(function() {
          msg.className = 'msg error';
          msg.textContent = '❌ Error de conexión';
          btn.disabled = false;
          btn.textContent = '💾 Guardar en GitHub';
      });
}

function filtrarCanales() {
    var q = document.getElementById('buscador').value.toLowerCase();
    document.querySelectorAll('.canal-card').forEach(function(card) {
        var texto = card.textContent.toLowerCase();
        card.style.display = (!q || texto.includes(q)) ? '' : 'none';
    });
    // Mostrar/ocultar secciones vacías
    document.querySelectorAll('[id^="lista-"]').forEach(function(sec) {
        var visible = Array.from(sec.querySelectorAll('.canal-card')).some(function(c) {
            return c.style.display !== 'none';
        });
        sec.style.display = visible ? '' : 'none';
    });
}

cargarCanales();
</script>
